name: e2e

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # nightly full run
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Start Astronomy Shop
        run: ../scripts/start-demo.sh

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Check tests use page objects only
        run: npm run lint:pom

      - name: Run tests
        # PRs run the fast smoke subset; main, nightly and manual runs run everything.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run test:smoke
          else
            npm test
          fi

      - name: Dump service logs on failure
        if: failure()
        working-directory: .demo
        run: |
          docker compose logs --no-color --tail=200 > ../automation/test-results/docker-logs.txt || true
          # one line per container ("<name> <status>"): the triage agent reads this to spot unhealthy services
          docker ps --format '{{.Names}} {{.Status}}' > ../automation/test-results/docker-ps.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            automation/playwright-report
            automation/test-results
            automation/allure-results
          retention-days: 14

  agent:
    # CI triage agent (see agentic/AGENT-DESIGN.md). Shadow mode: it reports, it never fails the build or acts on a failure.
    # The model runs through Claude Code with a subscription token (CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`), not an API key.
    # Without the secret (forks, or not set up yet) the checks and the signal-only triage still run, and the report says so.
    needs: playwright
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    defaults:
      run:
        working-directory: agentic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the triage agent reads the last commit's diff

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # runs the TypeScript directly (type stripping)
          cache: npm
          cache-dependency-path: agentic/package-lock.json

      - run: npm ci
      - name: Typecheck and unit tests (no model needed)
        run: npm run check

      - name: Download Playwright results
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: automation
        continue-on-error: true

      - name: Install Claude Code
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code@2.1.302   # the version the CLI flags were verified on

      - name: Run the eval
        # Not on PRs: it costs about 29 model calls against the subscription. Main, nightly and manual runs only.
        id: eval
        if: env.CLAUDE_CODE_OAUTH_TOKEN != '' && github.event_name != 'pull_request'
        continue-on-error: true
        run: npm run eval -- --out out

      - name: Triage this run's failures
        id: triage
        continue-on-error: true
        run: |
          mkdir -p out
          RESULTS=../automation/test-results/results.json
          if [ ! -f "$RESULTS" ]; then echo "No results.json, nothing to triage"; exit 0; fi
          # ':/' = the whole repo (the job runs inside agentic/, so '.' would hide changes under src/ and automation/)
          git diff HEAD~1 HEAD -- ':/' ':(exclude)*package-lock.json' > out/change.patch || true
          MODE=""
          [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && MODE="--signals-only"
          node src/ci-triage.ts --results "$RESULTS" --docker-ps ../automation/test-results/docker-ps.txt \
            --diff out/change.patch --out out/triage-results.json $MODE

      - name: Build the agent report
        if: always()
        run: |
          if [ "${{ steps.eval.outcome }}" = "success" ]; then EVAL=out/latest.json; FRESH=true; else EVAL=evals/results/latest.json; FRESH=false; fi
          TRIAGE=out/triage-results.json
          node report/build.mjs --eval "$EVAL" --fresh "$FRESH" --triage "$TRIAGE" --out site --summary out/summary.md
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-report
          path: agentic/site
          retention-days: 14

  dashboard:
    # Publishes the metrics dashboard to GitHub Pages after every main/nightly/manual run,
    # including red ones: a failing run is exactly what the dashboard should show.
    needs: [playwright, agent]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # Allure 3 and the dashboard builder

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: automation
        continue-on-error: true

      - name: Fetch run history from the published site
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.json" -o history.json || echo '[]' > history.json

      - name: Build dashboard
        run: node dashboard/build.mjs --results automation/test-results/results.json --history history.json --out site

      - name: Build the Allure report (served at /allure/)
        # Allure 3 runs on Node only (no Java). The history file is fetched from the last published
        # report and appended to, so the report's trend charts grow with every run.
        if: hashFiles('automation/allure-results/*') != ''
        working-directory: automation
        run: |
          npm ci
          mkdir -p allure-history
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/history.jsonl" -o allure-history/history.jsonl || rm -f allure-history/history.jsonl
          npx allure generate allure-results --config allurerc.mjs --output ../site/allure --clean
          cp allure-history/history.jsonl ../site/allure/history.jsonl

      - name: Add the CI triage agent report (served at /agent/)
        uses: actions/download-artifact@v4
        with:
          name: agent-report
          path: site/agent
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
